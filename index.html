<style>
:root { --apricot: #e8c1a0; --ease: cubic-bezier(.16, 1, .3, 1); --ease-io: cubic-bezier(.76, 0, .24, 1); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0908; }
body { overflow: hidden; font-family: "Cormorant", "Cormorant Garamond", Georgia, "Times New Roman", serif; color: #fff; -webkit-font-smoothing: antialiased; }
.stage { position: relative; height: 100svh; min-height: 420px; overflow: hidden; }
.bg { position: absolute; inset: -3%; animation: bg-in 2.8s var(--ease) both; will-change: transform, opacity; }
.bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 72%; display: block; scale: 1.2; transform-origin: 50% 76%; transform: translate3d(var(--px, 0px), var(--py, 0px), 0); transition: transform 1.2s var(--ease); }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 54% 36% at 50% 53%, rgba(0,0,0,.3) 0%, rgba(0,0,0,.22) 26%, rgba(0,0,0,.12) 52%, rgba(0,0,0,.04) 76%, rgba(0,0,0,0) 100%), rgba(0,0,0,.08); }
.copy { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 6vw; gap: clamp(12px, 2.2vh, 22px); }
.name { position: relative; display: inline-block; padding: .3em .5em; color: #fff; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: clamp(26px, 2.9vw, 52px); line-height: 1; letter-spacing: .04em; filter: drop-shadow(0 1px 2px rgba(0,0,0,.22)) drop-shadow(0 4px 22px rgba(0,0,0,.3)); transition: color .5s var(--ease), letter-spacing .8s var(--ease), transform .8s var(--ease); }
.name .m { display: block; overflow: hidden; padding: .06em 0 .12em; margin: -.06em 0 -.12em; }
.name .m span { display: block; animation: rise 1.3s .7s var(--ease) both; will-change: transform; }
.name::after { content: ""; position: absolute; left: .5em; right: .5em; bottom: .12em; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .8s var(--ease); }
.name:hover, .name:focus-visible { color: var(--apricot); letter-spacing: .09em; transform: scale(1.07); }
.name:hover::after, .name:focus-visible::after { transform: scaleX(1); }
.name:focus-visible { outline: 2px solid var(--apricot); outline-offset: 6px; }
.tag { margin: 0; font-size: clamp(14px, 1.15vw, 19px); font-weight: 500; letter-spacing: .1em; color: rgba(255,255,255,.88); text-shadow: 0 1px 18px rgba(0,0,0,.6); animation: fade 1.4s 1.5s var(--ease) both; }
.curtain { position: fixed; inset: 0; z-index: 10; background: #efebe4; color: #1b1714; display: flex; align-items: center; justify-content: center; transform: translateY(100%); pointer-events: none; transition: transform .9s var(--ease-io); }
.curtain span { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(22px, 2.6vw, 38px); }
.leaving .curtain { transform: none; }
.leaving .bg { transform: scale(1.12); transition: transform 1s var(--ease-io); }
.leaving .copy { opacity: 0; transition: opacity .45s; }
@keyframes bg-in { from { opacity: 0; transform: scale(1.14); } to { opacity: 1; transform: scale(1); } }
@keyframes rise { from { transform: translateY(115%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (max-width: 899px) { .name { font-size: clamp(24px, 7.2vw, 38px); letter-spacing: .03em; } .tag { font-size: 15px; letter-spacing: .06em; } .bg img { object-position: 48% 70%; } }
@media (prefers-reduced-motion: reduce) { .bg, .name .m span, .tag { animation: none; } .bg img, .name, .curtain { transition: none; } .name:hover, .name:focus-visible { transform: none; letter-spacing: .04em; } }

<script>
(() => {
  const d = document.documentElement, link = document.querySelector('.name'), bg = document.querySelector('.bg img');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* the photo drifts a few pixels against the pointer */
  if (!calm && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let raf = 0;
    addEventListener('pointermove', e => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        bg.style.setProperty('--px', ((.5 - e.clientX / innerWidth) * 26).toFixed(1) + 'px');
        bg.style.setProperty('--py', ((.5 - e.clientY / innerHeight) * 16).toFixed(1) + 'px');
      });
    }, { passive: true });
  }
  link.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || calm) return;
    e.preventDefault();
    try { sessionStorage.setItem('df-pt', '1'); } catch (_) {}
    document.body.classList.add('leaving');
    setTimeout(() => { location.href = link.href; }, 950);
  });
  addEventListener('pageshow', e => { if (e.persisted) document.body.classList.remove('leaving'); });
})();
</script>
